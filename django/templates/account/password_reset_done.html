{% extends "base.html" %}
{% block title %}Check Your Email — StarWolf{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">🐺</div>
    <h2 class="auth-title">Check Your Email</h2>
    <p class="auth-subtitle">If that address has an account, we've sent a password reset link. Check your inbox (and spam folder).</p>
    <a href="{% url 'account_login' %}" class="btn-primary" style="display:inline-block;text-decoration:none;padding:0.6rem 1.4rem;border-radius:6px;margin-top:1.25rem;">← Back to Sign In</a>
  </div>
</div>
{% endblock %}
