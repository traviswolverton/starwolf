<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}StarWolf{% endblock %}</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
  <script src="https://unpkg.com/alpinejs@3.14.9/dist/cdn.min.js" defer></script>
</head>
<body>
  <header x-data="{ open: false }">
    <div class="nav-bar">
      <a href="/" class="nav-brand">🔭 StarWolf</a>

      <button class="nav-toggle" @click="open = !open" :aria-expanded="open.toString()" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>

    <nav class="nav-links" :class="{ 'is-open': open }">
      <a href="{% url 'about' %}" @click="open = false">About</a>
      {% if user.is_authenticated %}
        <span class="nav-user">👤 {{ user.email }}</span>
      {% endif %}
    </nav>
  </header>

  {% if messages %}
    <ul class="messages">
      {% for message in messages %}
        <li class="{{ message.tags }}">{{ message }}</li>
      {% endfor %}
    </ul>
  {% endif %}

  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
